<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F3F3F">
<title>복지큐레이션센터 온보딩 가이드북</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#3F3F3F;--card:#FFFFFF;--text:#2B2B2B;--muted:#707070;--line:#E3E3E0;--accent:#FFC300;--err:#A2451B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B1B1A;--card:#272726;--text:#F2F2F0;--muted:#A8A8A4;--line:#3A3A38;--err:#F09A6E}}
:root[data-theme="dark"]{--bg:#1B1B1A;--card:#272726;--text:#F2F2F0;--muted:#A8A8A4;--line:#3A3A38;--err:#F09A6E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
.card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:28px 22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--accent)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);position:relative}
h1{font-size:24px;line-height:1.35;margin:8px 0 6px;letter-spacing:-.02em;position:relative}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
form{margin-top:22px;display:grid;gap:10px}
input[type=password]{font:inherit;font-size:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);width:100%}
input[type=password]:focus{outline:3px solid var(--accent);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
label.rem input{width:18px;height:18px;accent-color:#3F3F3F}
button{font:inherit;font-weight:800;font-size:16px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#2B2B2B;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--err);font-size:14px;min-height:1.4em}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">WELCOME LINKAGELAB</div>
  <h1>복지큐레이션센터<br>온보딩 가이드북</h1>
  <p>교육스탭에게 받은 비밀번호를 입력해 주세요.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="비밀번호" inputmode="numeric" autocomplete="current-password" aria-label="비밀번호" required>
    <label class="rem"><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
    <div class="err" id="err" role="alert"></div>
    <button id="btn">들어가기</button>
  </form>
</main>

const KEY='gb-key';
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){}},del(){try{localStorage.removeItem(KEY)}catch(e){}}};

async function open(rawKey){
  const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},key,ub(P.c)));
  // writing while the gate is still parsing appends instead of replacing — wait for load first
  if(document.readyState!=='complete') await new Promise(r=>addEventListener('load',r,{once:true}));
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},base,256));
}

// remembered device: open straight away
const saved=store.get();
if(saved){
  document.documentElement.style.visibility='hidden';
  open(ub(saved)).catch(()=>{store.del();document.documentElement.style.visibility='';});
}

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('btn'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='확인 중…';err.textContent='';
  try{
    const raw=await derive(document.getElementById('pw').value);
    if(document.getElementById('rem').checked) store.set(btoa(String.fromCharCode(...raw)));
    await open(raw);
  }catch(x){
    store.del();
    err.textContent='비밀번호가 맞지 않아요. 다시 확인해 주세요.';
    btn.disabled=false;btn.textContent='들어가기';
  }
});
</script>
